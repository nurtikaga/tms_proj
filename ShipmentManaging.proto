syntax = "proto3";

package tmsmanagerpb.v1;

option go_package = "github.com/nurtikaga/tms_proj/tms-protos/go;tmsmanagerpb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ShipmentService {
  rpc CreateShipment(CreateShipmentRequest) returns (ShipmentResponse);
  rpc GetShipment(GetShipmentRequest)       returns (ShipmentResponse);
  rpc AddEvent(AddEventRequest)             returns (google.protobuf.Empty);
  rpc GetHistory(GetHistoryRequest)         returns (HistoryResponse);
}

message CreateShipmentRequest {
  string reference_number = 1;
  string origin           = 2;
  string destination      = 3;
  string driver_name      = 4;
  string unit_number      = 5;
  double shipment_amount  = 6;
  double driver_revenue   = 7;
}

message GetShipmentRequest {
  string id = 1;
}

message AddEventRequest {
  string         shipment_id = 1;
  ShipmentStatus status      = 2;
  string         note        = 3;
}

message GetHistoryRequest {
  string shipment_id = 1;
}

message ShipmentResponse {
  string                    id               = 1;
  string                    reference_number = 2;
  string                    origin           = 3;
  string                    destination      = 4;
  ShipmentStatus            status           = 5;
  string                    driver_name      = 6;
  string                    unit_number      = 7;
  double                    shipment_amount  = 8;
  double                    driver_revenue   = 9;
  google.protobuf.Timestamp created_at       = 10;
  google.protobuf.Timestamp updated_at       = 11;
}

message HistoryResponse {
  repeated ShipmentEvent events = 1;
}

message ShipmentEvent {
  string                    id          = 1;
  ShipmentStatus            status      = 2;
  string                    note        = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

enum ShipmentStatus {
  SHIPMENT_STATUS_UNSPECIFIED = 0;
  SHIPMENT_STATUS_PENDING     = 1;
  SHIPMENT_STATUS_PICKED_UP   = 2;
  SHIPMENT_STATUS_IN_TRANSIT  = 3;
  SHIPMENT_STATUS_DELIVERED   = 4;
}